version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts_cache:/app/artifacts_cache
      - ./api/assets:/app/api/assets
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: always

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts_cache:/app/artifacts_cache
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api
    restart: always
