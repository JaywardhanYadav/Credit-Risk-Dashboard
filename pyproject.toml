[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scorecard"
version = "0.1.0"
description = "Credit Risk Application Scorecard System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.24.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.2.0",
    "mlflow>=2.0.0",
    "dvc>=3.0.0",
    "pytest>=7.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "plotly>=5.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
